# Alloy CI — Node 22.19+, unit + integration, pack smoke, Docker e2e (dind)
# Matches engines.node in package.json (Pi requirement).

image: node:22.19-bookworm

stages:
  - test
  - integration
  - pack

variables:
  npm_config_cache: "$CI_PROJECT_DIR/.npm"
  AUDIT_LEVEL: critical
  # Docker-in-Docker
  DOCKER_TLS_CERTDIR: "/certs"
  DOCKER_DRIVER: overlay2

cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - .npm/
    - node_modules/

.default_rules: &default_rules
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

.npm_setup: &npm_setup
  - node -e "const [a,b]=process.versions.node.split('.').map(Number); if(a<22||(a===22&&b<19)){console.error('Need Node>=22.19'); process.exit(1)}"
  - npm ci

unit:
  stage: test
  <<: *default_rules
  script:
    - *npm_setup
    - npm test
    - node ./bin/alloy.mjs --version

integration-mcp-pi:
  stage: integration
  <<: *default_rules
  script:
    - *npm_setup
    # Fake MCP + isolated Pi/alloy startup (no Docker required)
    - node --test test/integration/mcp-fake.e2e.test.mjs test/integration/pi-startup.e2e.test.mjs

integration-docker:
  stage: integration
  <<: *default_rules
  image: docker:27-cli
  services:
    - name: docker:27-dind
      alias: docker
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  before_script:
    - apk add --no-cache nodejs npm bash git
    # Node from alpine may be 20.x — use node image side-car style if needed
    - node -v || true
    - until docker info >/dev/null 2>&1; do echo "waiting for docker…"; sleep 2; done
  script:
    - |
      # Prefer Node 22 for tests; if apk node is too old, run tests in node container with docker.sock
      if node -e "const [a,b]=process.versions.node.split('.').map(Number); process.exit(a>22||(a===22&&b>=19)?0:1)" 2>/dev/null; then
        npm ci
        # Pull sandbox image used by Alloy defaults
        docker pull node:22-bookworm
        node --test test/integration/docker-sandbox.e2e.test.mjs
      else
        echo "Host node too old for unit runner; using node:22.19 container with docker CLI"
        docker pull node:22-bookworm
        docker pull node:22.19-bookworm
        docker run --rm \
          -v "$CI_PROJECT_DIR:$CI_PROJECT_DIR" \
          -v /var/run/docker.sock:/var/run/docker.sock \
          -w "$CI_PROJECT_DIR" \
          -e ALLOY_HOME=/tmp/alloy-ci-home \
          -e PI_CODING_AGENT_DIR=/tmp/alloy-ci-agent \
          node:22.19-bookworm \
          bash -lc "npm ci && node --test test/integration/docker-sandbox.e2e.test.mjs"
      fi
  # dind can be flaky on some runners — keep visible but don't block main if service missing
  allow_failure: true

pack-smoke:
  stage: pack
  <<: *default_rules
  script:
    - *npm_setup
    - npm pack --dry-run 2>&1 | tee pack-list.txt
    - grep -q 'install.sh' pack-list.txt
    - grep -q 'scripts/install-cli.sh' pack-list.txt
    - grep -q 'bin/alloy.mjs' pack-list.txt
    - grep -q 'test/fixtures/fake-mcp-server.mjs' pack-list.txt || true
    - node -e "const p=require('./package.json'); if(p.engines.node!=='>=22.19.0') process.exit(1)"
    - node -e "const v=require('./package.json').version; const l=require('./package-lock.json').version; if(v!==l){console.error('version mismatch',v,l); process.exit(1)}"
  artifacts:
    when: always
    paths:
      - pack-list.txt
    expire_in: 7 days

audit:
  stage: test
  <<: *default_rules
  allow_failure: true
  script:
    - *npm_setup
    - npm audit --audit-level=$AUDIT_LEVEL || true
    - |
      echo "Full audit (informational — nested Pi deps may report high/moderate):"
      npm audit || true

doctor-cli:
  stage: test
  <<: *default_rules
  script:
    - *npm_setup
    - npm run doctor
    - node -e "import('./lib/model-catalog.mjs').then(m=>{const r=m.validateDefaultModels(); const bad=r.filter(x=>!x.ok); if(bad.length){console.error(bad); process.exit(1)} console.log('catalog ok', r.length)})"
