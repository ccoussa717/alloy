# Alloy CI: tests, installed-artifact smoke, security, SBOM, and Docker e2e.
# Matches engines.node in package.json (Pi requirement).

include:
  - template: Jobs/Secret-Detection.gitlab-ci.yml

image: node:22.19.0-bookworm

stages:
  - security
  - test
  - integration
  - pack

variables:
  GIT_DEPTH: "0"
  npm_config_cache: "$CI_PROJECT_DIR/.npm"
  AUDIT_LEVEL: high
  SECRET_DETECTION_HISTORIC_SCAN: "true"

cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - .npm/
    - node_modules/

.default_rules: &default_rules
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH

.npm_setup: &npm_setup
  - node -e "const [a,b]=process.versions.node.split('.').map(Number); if(a<22||(a===22&&b<19)){console.error('Need Node>=22.19'); process.exit(1)}"
  - npm ci

unit:
  stage: test
  <<: *default_rules
  script:
    - *npm_setup
    - npm test
    - node ./bin/alloy.mjs --version
    - npm run security:scan
    - npm run release:verify

secret_detection:
  <<: *default_rules
  stage: security
  allow_failure: false

validate-security-report:
  stage: test
  <<: *default_rules
  needs:
    - job: secret_detection
      artifacts: true
  script:
    - node scripts/validate-security-report.mjs

integration-mcp-pi:
  stage: integration
  <<: *default_rules
  script:
    - *npm_setup
    - node --test --test-force-exit test/integration/mcp-fake.e2e.test.mjs test/integration/mcp-http.e2e.test.mjs test/integration/pi-startup.e2e.test.mjs test/integration/packed-install.e2e.test.mjs

integration-docker:
  stage: integration
  <<: *default_rules
  image: node:22.19.0-bookworm
  services:
    - name: docker:27.5.1-dind
      alias: docker
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    ALLOY_REQUIRE_DOCKER_TEST: "1"
    TMPDIR: "$CI_PROJECT_DIR/.docker-tmp"
  before_script:
    - node -e "if(process.versions.node !== '22.19.0') process.exit(1)"
    - apt-get update
    - apt-get install -y --no-install-recommends docker.io
    - mkdir -p "$TMPDIR"
    - |
      for attempt in $(seq 1 60); do
        docker info >/dev/null 2>&1 && break
        if [ "$attempt" -eq 60 ]; then
          echo "Docker daemon did not become ready" >&2
          exit 1
        fi
        sleep 2
      done
  script:
    - npm ci
    - docker pull node:22-bookworm
    - ALLOY_REQUIRE_DOCKER_TEST=1 node --test test/integration/docker-sandbox.e2e.test.mjs

pack-smoke:
  stage: pack
  <<: *default_rules
  script:
    - *npm_setup
    - npm pack --dry-run 2>&1 | tee pack-list.txt
    - grep -q 'install.sh' pack-list.txt
    - grep -q 'scripts/install-cli.sh' pack-list.txt
    - grep -q 'bin/alloy.mjs' pack-list.txt
    - grep -q 'npm-shrinkwrap.json' pack-list.txt
    - grep -q 'CONTRIBUTING.md' pack-list.txt
    - node -e "const p=require('./package.json'); if(p.engines.node!=='>=22.19.0') process.exit(1)"
    - npm run release:verify
    - if [ -n "${CI_COMMIT_TAG:-}" ]; then npm run release:verify:publish; fi
  artifacts:
    when: always
    paths:
      - pack-list.txt
    expire_in: 7 days

audit:
  stage: test
  <<: *default_rules
  script:
    - *npm_setup
    - npm audit --omit=dev --audit-level=$AUDIT_LEVEL

sbom:
  stage: pack
  <<: *default_rules
  script:
    - *npm_setup
    - npm run --silent sbom > alloy.cdx.json
    - node -e "const b=require('./alloy.cdx.json'); if(b.bomFormat!=='CycloneDX'||!b.specVersion) process.exit(1)"
  artifacts:
    paths:
      - alloy.cdx.json
    expire_in: 30 days

doctor-cli:
  stage: test
  <<: *default_rules
  script:
    - *npm_setup
    - npm run doctor
    - node -e "import('./lib/model-catalog.mjs').then(m=>{const r=m.validateDefaultModels(); const bad=r.filter(x=>!x.ok); if(bad.length){console.error(bad); process.exit(1)} console.log('catalog ok', r.length)})"
