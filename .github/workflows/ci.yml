name: CI

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out full history
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22.19.0
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Test source-only SWE-bench release tooling
        run: bash scripts/run-swebench-release-smoke.sh test

      - name: Install checksum-verified Bun 1.3.14 and tmux
        run: |
          sudo apt-get update
          sudo apt-get install -y tmux unzip
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/bun-linux-x64-baseline.zip" \
            "https://github.com/oven-sh/bun/releases/download/bun-v1.3.14/bun-linux-x64-baseline.zip"
          printf '%s  %s\n' \
            'a063908ae08b7852ca10939bbdc6ceed3ddabce8fb9402dce83d65d73b36e6c7' \
            "$RUNNER_TEMP/bun-linux-x64-baseline.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/bun-linux-x64-baseline.zip" -d "$RUNNER_TEMP"
          mkdir -p "$RUNNER_TEMP/alloy-bun/bin"
          install -m 755 "$RUNNER_TEMP/bun-linux-x64-baseline/bun" "$RUNNER_TEMP/alloy-bun/bin/bun"
          "$RUNNER_TEMP/alloy-bun/bin/bun" --version | grep -Fx '1.3.14'
          printf '%s\n' "$RUNNER_TEMP/alloy-bun/bin" >> "$GITHUB_PATH"
          printf 'ALLOY_BUN_BIN=%s\n' "$RUNNER_TEMP/alloy-bun/bin/bun" >> "$GITHUB_ENV"

      - name: Install exact dependencies
        run: npm ci

      - name: Install frozen TUI dependencies
        run: bun install --cwd tui --frozen-lockfile

      - name: Run local verification
        run: npm run ci:checks
        env:
          ALLOY_REQUIRE_DOCKER_TEST: "1"

      - name: Verify SWE-bench Docker isolation
        run: |
          sudo apt-get update
          sudo apt-get install -y apparmor-utils nftables
          sudo apparmor_parser -r benchmarks/swebench/policies/alloy-swebench-gate.apparmor
          sudo --preserve-env=PATH,ALLOY_SWEBENCH_REQUIRE_DOCKER \
            python3 -m unittest benchmarks.swebench.tests.test_docker_integration -v
        env:
          ALLOY_SWEBENCH_REQUIRE_DOCKER: "1"

      - name: Verify packed OpenTUI with the real backend in a PTY
        run: npm run verify:opentui-packed

      - name: Verify source and fork provenance
        if: ${{ github.ref_type != 'tag' }}
        run: npm run release:verify:source
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Bootstrap Node.js and install from a clean Linux environment
        run: |
          mkdir -p "$RUNNER_TEMP/alloy-bootstrap-home"
          env -i \
            HOME="$RUNNER_TEMP/alloy-bootstrap-home" \
            PATH="/usr/bin:/bin" \
            ALLOY_REF="$GITHUB_SHA" \
            ALLOY_PREFIX="$RUNNER_TEMP/alloy-bootstrap-prefix" \
            XDG_DATA_HOME="$RUNNER_TEMP/alloy-bootstrap-data" \
            /bin/bash ./install.sh
          "$RUNNER_TEMP/alloy-bootstrap-prefix/bin/alloy" --version

      - name: Report dependency advisories
        run: npm audit --omit=dev --audit-level=critical

      - name: Enforce release dependency policy
        if: ${{ github.ref_type == 'tag' }}
        run: npm run audit:release

      - name: Validate blocked-publication release metadata
        if: ${{ always() && github.ref_type == 'tag' }}
        run: npm run release:verify:source && npm run release:verify:tui
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}

      - name: Upload CycloneDX SBOM
        if: ${{ always() && hashFiles('alloy.cdx.json') != '' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: alloy-sbom
          path: alloy.cdx.json
          if-no-files-found: error
          retention-days: 30

  installer-macos:
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22.19.0

      - name: Test piped installer under macOS Bash
        run: node --test test/unit/install-script.test.mjs

      - name: Install exact public source tree
        run: npm run test:installer

      - name: Bootstrap Node.js and install from a clean macOS environment
        run: |
          mkdir -p "$RUNNER_TEMP/alloy-bootstrap-home"
          env -i \
            HOME="$RUNNER_TEMP/alloy-bootstrap-home" \
            PATH="/usr/bin:/bin:/usr/sbin:/sbin" \
            ALLOY_REF="$GITHUB_SHA" \
            ALLOY_PREFIX="$RUNNER_TEMP/alloy-bootstrap-prefix" \
            XDG_DATA_HOME="$RUNNER_TEMP/alloy-bootstrap-data" \
            /bin/bash ./install.sh
          "$RUNNER_TEMP/alloy-bootstrap-prefix/bin/alloy" --version

  verify:
    if: ${{ always() }}
    needs:
      - verify-linux
      - installer-macos
    runs-on: ubuntu-24.04
    steps:
      - name: Require Linux and macOS verification
        env:
          LINUX_RESULT: ${{ needs.verify-linux.result }}
          MACOS_RESULT: ${{ needs.installer-macos.result }}
        run: |
          test "$LINUX_RESULT" = "success"
          test "$MACOS_RESULT" = "success"
