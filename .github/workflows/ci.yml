name: CI

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out full history
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22.19.0
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Run release verification
        run: npm run ci:local
        env:
          ALLOY_REQUIRE_DOCKER_TEST: "1"
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}

      - name: Report dependency advisories
        continue-on-error: true
        run: npm audit --omit=dev

      - name: Enforce release dependency policy
        if: ${{ github.ref_type == 'tag' }}
        run: npm run audit:release

      - name: Validate publish metadata
        if: ${{ always() && github.ref_type == 'tag' }}
        run: npm run release:verify:publish

      - name: Upload CycloneDX SBOM
        if: ${{ always() && hashFiles('alloy.cdx.json') != '' }}
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: alloy-sbom
          path: alloy.cdx.json
          if-no-files-found: error
          retention-days: 30
